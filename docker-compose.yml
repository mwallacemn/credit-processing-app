name: credit-processing

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: credit-processing-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=credits_db
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - credit-processing-network

  # 2. Redis Message Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: credit-processing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - credit-processing-network

  # 3. Core Python App (FastAPI REST API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credit-processing-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=credits_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - credit-processing-network

  # 4. Celery Worker
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: credit-processing-celery-worker
    restart: unless-stopped
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=credits_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: celery -A app.infrastructure.celery_app.celery_app worker --loglevel=info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - credit-processing-network

  # 5. Mini Front-End App (React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credit-processing-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - credit-processing-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  credit-processing-network:
    driver: bridge
